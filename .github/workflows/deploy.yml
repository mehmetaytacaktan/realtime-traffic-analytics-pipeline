name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]

  # You can trigger manually if you want
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Write you HuggingFace user id and space id:
          HF_USERNAME: "musashivulpix"
          SPACE_NAME: "realtime-traffic-analytics-pipeline"
        run: |
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME main